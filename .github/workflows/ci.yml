name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Next.js build
        run: npm run build
        env:
          # Build skal kunne gennemføres uden ægte DB — koden falder tilbage på warnings.
          DATABASE_URL: ''
          NEXT_PUBLIC_APP_URL: 'https://crm.example.com'

  # Bygger det færdige produktionsbillede hos GitHub i stedet for på Hetzner-serveren.
  # Serveren har 4 GB hukommelse, og et Next.js-build på den gjorde CRM og kundeside utilgængelige
  # i over en time den 9.10.2026. Her bygges billedet på en ARM-maskine (samme arkitektur som
  # serveren), og Coolify henter kun det færdige billede via Dockerfile.deploy.
  image:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Byg og skub billedet
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/jacoblisby/crm-v2:latest
            ghcr.io/jacoblisby/crm-v2:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jacoblisby/crm-v2
          build-args: |
            NEXT_PUBLIC_APP_URL=https://crm.365ejendom.dk
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dockerfile.deploy peger på præcis dette billede. Det gør en deploy forudsigelig (ingen gammelt
      # «latest» i serverens cache), og en tilbagerulning er en git revert.
      - name: Peg Dockerfile.deploy på det nye billede
        run: |
          printf '%s\n' \
            '# Skrives automatisk af .github/workflows/ci.yml. Peger på det billede, GitHub har bygget.' \
            'FROM ghcr.io/jacoblisby/crm-v2:sha-${{ github.sha }}' > Dockerfile.deploy
          if ! git diff --quiet -- Dockerfile.deploy; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Dockerfile.deploy
            git commit -m "deploy: billede sha-${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
